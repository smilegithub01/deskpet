name: Release

# 打 tag (v*) 时自动构建并发布 GitHub Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '版本标签 (如 v1.0.0)'
        required: true

env:
  GRADLE_VERSION: '8.5'

jobs:
  release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Remove local.properties
        run: rm -f local.properties

      # 手动安装 Gradle（绕过 wrapper 的 Java HTTP 下载）
      - name: Install Gradle
        run: |
          GRADLE_URL="https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          curl -fsSL "$GRADLE_URL" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/
          echo "/opt/gradle-${GRADLE_VERSION}/bin" >> $GITHUB_PATH
          rm /tmp/gradle.zip

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ---------- 构建版本信息 ----------
      - name: Set version name
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "::notice::发布版本: $TAG"

      # ---------- 构建 Debug + Release APK ----------
      - name: Build APKs
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      # ---------- 重命名 APK (带版本号) ----------
      - name: Rename APKs
        id: apk
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          mkdir -p release-assets
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk "release-assets/DeskPet-${TAG}-debug.apk"
            echo "debug_built=true" >> $GITHUB_OUTPUT
          fi
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk "release-assets/DeskPet-${TAG}-release-unsigned.apk"
            echo "release_built=true" >> $GITHUB_OUTPUT
          fi
          ls -lh release-assets/

      # ---------- 创建 GitHub Release ----------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: DeskPet ${{ steps.ver.outputs.tag }}
          body: |
            ## DeskPet ${{ steps.ver.outputs.tag }}

            ### 下载说明
            - `DeskPet-*-debug.apk` — Debug 版本（可直接安装，带调试信息）
            - `DeskPet-*-release-unsigned.apk` — Release 版本（未签名，安装前需手动信任）

            ### 安装方式
            1. 下载对应 APK 文件到手机
            2. 在文件管理器中点击安装
            3. 如提示「未知来源」，请允许安装

            > Release 版本未签名，建议优先使用 Debug 版本。
          files: release-assets/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
